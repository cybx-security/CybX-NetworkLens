# Builds every download on GitHub-hosted runners and, for a version tag,
# attaches them to a DRAFT release. Publishing the draft is a deliberate
# click: the moment it is public, every installed copy's "Check for Updates"
# offers it (src/updater.py reads /releases/latest).
#
#   git tag v1.2.0 && git push origin v1.2.0      -> build + draft release
#   Actions > Release > Run workflow              -> build only (artifacts)
#
# Each platform job runs that platform's build script unchanged; this file
# only fetches what a developer would copy into binaries\windows by hand and
# gathers the results. Npcap is NOT bundled here (SKIP_NPCAP): the free Npcap
# licence does not allow redistribution, and a public release is exactly
# that. The installer downloads it from npcap.com during setup instead.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  NMAP_VERSION: "7.991"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches src/version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = python src/version.py
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} but src/version.py says $v" }

      - name: Fetch nmap for bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # nmap.org no longer publishes a portable zip; the setup.exe is an
          # NSIS installer, which 7-Zip can unpack like an archive.
          $setup = "nmap-$env:NMAP_VERSION-setup.exe"
          Invoke-WebRequest -Uri "https://nmap.org/dist/$setup" -OutFile $setup -UseBasicParsing
          & 7z x $setup -onmap-unpacked -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack $setup (exit $LASTEXITCODE)" }
          # Not needed for scanning: the Zenmap GUI, the installer's own
          # plugins (which include Npcap - see the licence note above), and
          # the uninstaller.
          Remove-Item -Recurse -Force nmap-unpacked\zenmap, 'nmap-unpacked\$PLUGINSDIR', nmap-unpacked\Uninstall.exe -ErrorAction SilentlyContinue
          if (-not (Test-Path nmap-unpacked\nmap.exe)) { throw "nmap.exe not found after unpacking $setup" }
          Copy-Item -Path "nmap-unpacked\*" -Destination binaries\windows -Recurse -Force
          # The VC++ runtime nmap.exe links against is not in the package (see
          # binaries\windows\README.txt). Official nmap is 32-bit: SysWOW64.
          Copy-Item "$env:WINDIR\SysWOW64\msvcp140.dll"     binaries\windows -Force
          Copy-Item "$env:WINDIR\SysWOW64\vcruntime140.dll" binaries\windows -Force
          Get-ChildItem binaries\windows | Select-Object -ExpandProperty Name

      - name: Install NSIS (builds the installer)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
          $exe = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $exe)) { throw "makensis.exe not found at $exe" }
          & $exe /VERSION

      - name: Build (build\build_windows.bat)
        shell: cmd
        env:
          NO_PAUSE: "1"
          SKIP_NPCAP: "1"
        run: build\build_windows.bat

      - name: Show build log on failure
        if: failure()
        shell: pwsh
        run: if (Test-Path build\build_log.txt) { Get-Content build\build_log.txt -Tail 200 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/CybXNetworkLens-Setup-*.exe
            dist/networklens.exe
            dist/networklens-gui.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install nmap
      - name: Build (build/build_macos.sh)
        run: |
          chmod +x build/*.sh
          ./build/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/CybXNetworkLens-*-macos-*.dmg

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the result runs on anything with
          # that glibc or newer (a PyInstaller build never runs on an older
          # glibc than it was built on).
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # The distro Python: it comes with tkinter and matches the system libs.
      - run: sudo apt-get update && sudo apt-get install -y nmap python3 python3-venv python3-tk python3-pip
      - name: Build (build/build_linux.sh)
        run: |
          chmod +x build/*.sh
          ./build/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/CybXNetworkLens-*-linux-*.tar.gz

  # One job gathers everything: a single SHA256SUMS covering every file (the
  # updater verifies the Windows installer against it) and one draft release
  # instead of several jobs racing to create it.
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: artifacts/
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: packaging/release-notes.md
          generate_release_notes: true
          draft: true
