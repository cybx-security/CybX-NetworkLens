name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests build real nmap command lines, which needs an nmap to resolve.
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: python -m py_compile src/*.py test_modules.py
      - run: python test_modules.py
